# Shared subflow: clears Expo Go's data, including the app's database, and opens the app.
# Every flow that needs an empty state starts with this.
appId: host.exp.exponent
---
# Clearing the data also revokes Expo Go's local network permission (Android 17), without which
# Expo Go cannot reach Metro at 10.0.2.2. launchApp grants it again (docs/adr/0008).
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: open-app.yaml
- extendedWaitUntil:
    visible: 'Tervetuloa'
    timeout: 60000
# Expo Go may open its developer menu only after the app has loaded (seen after a Metro restart).
- runFlow:
    when:
      visible: 'Go home'
    commands:
      - pressKey: back
- extendedWaitUntil:
    notVisible: 'Go home'
    timeout: 5000
